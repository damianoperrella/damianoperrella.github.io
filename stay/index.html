<!DOCTYPE html>
<html lang="en" data-stay>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pt-color" content="#3a0e14">
<meta name="robots" content="noindex">
<title>Damiano Perrella</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="../site.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; overflow: hidden; }
  video, .poster { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 72%; image-rendering: pixelated; }
  .poster { background: url("night.png") 50% 72% / cover no-repeat; }
  .words { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px 26px; box-sizing: border-box;
           background: rgba(0, 0, 0, .38); }
  .words p { margin: 0 auto 0 0; max-width: 34em; font-size: clamp(12px, 1.05vw, 15px); line-height: 1.45; letter-spacing: .005em; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
  .words a { color: inherit; text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; opacity: .85; }
  .words a:hover, .words a:focus-visible { opacity: 1; }
</style>
</head>
<body>
<div class="poster" aria-hidden="true"></div>
<video src="night.mp4" poster="night.png" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="words">
  <p>That wasn&rsquo;t supposed to happen. Or was it? I can&rsquo;t remember now. If you want to <a id="back" href="/">go back</a>, you can. Or stay a while.</p>
</div>
<script>
  // "go back" returns to the page the click started from (falls back to the front page)
  (function () {
    try {
      var from = sessionStorage.getItem("detour-from");
      if (from && new URL(from).origin === location.origin) document.getElementById("back").href = from;
    } catch (e) {}
  })();
</script>
</body>
</html>
