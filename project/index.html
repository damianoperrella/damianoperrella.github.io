<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pt-color" content="#141414">
<title>Project — Damiano Perrella</title>
<script src="../site.js"></script>
<link rel="stylesheet" href="../clean.css">
<style>
  /* the header sits over the full-screen plan: dark ink with a pale halo keeps it readable on pink, white and blue */
  body.ink-light .id a { color: #fff; text-shadow: 0 0 8px rgba(0,0,0,.55), 0 0 16px rgba(0,0,0,.35); }
  .id a { text-shadow: 0 0 6px rgba(255,255,255,.85), 0 0 14px rgba(255,255,255,.6); }

  /* ---------------- full-screen image ---------------- */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    min-height: 420px;
    overflow: hidden;
    background: #ececec;
  }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------------- the project ---------------- */
  .proj {
    max-width: var(--max);
    margin: 0 auto;
    padding: clamp(56px, 10vw, 140px) var(--pad) clamp(80px, 12vw, 180px);
  }
  .proj h1 {
    max-width: 14ch;
    font-size: clamp(40px, 7.4vw, 128px);
    line-height: .98;
    letter-spacing: -.035em;
  }
  .top {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: var(--gap);
    row-gap: 48px;
    margin-top: clamp(40px, 6vw, 96px);
  }
  .facts { grid-column: 1 / span 4; font-size: 14px; line-height: 1.4; }
  .facts > div {
    display: grid;
    grid-template-columns: 7.5em minmax(0, 1fr);
    gap: 0 var(--gap);
    padding: 11px 0;
    border-top: 1px solid var(--rule);
  }
  .facts > div:first-child { border-top-color: var(--ink); }
  .facts dt { color: var(--ink-soft); }
  .sub { margin-top: 1.1em; max-width: 34em; font-size: clamp(17px, 1.6vw, 24px); line-height: 1.3; letter-spacing: -.01em; }
  .desc h2 { font-size: clamp(22px, 2.2vw, 34px); line-height: 1.1; letter-spacing: -.02em; margin-bottom: .2em; }
  .desc { grid-column: 6 / span 7; display: flex; flex-direction: column; gap: 1.1em; }
  .desc p { max-width: 36em; font-size: clamp(17px, 1.5vw, 22px); line-height: 1.5; }
  .soon { font-size: 15px; color: var(--ink-soft); }

  /* ---------------- images and text of every size ---------------- */
  .gal {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: var(--gap);
    row-gap: clamp(36px, 6vw, 96px);
    align-items: start;
    margin-top: clamp(80px, 12vw, 200px);
  }
  .it { min-width: 0; }
  .it img { display: block; width: 100%; height: auto; background: #f0f0f0; }
  .cap { margin-top: 10px; font-size: 12px; line-height: 1.4; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .cap b { margin-right: .9em; font-weight: 400; color: var(--ink); }
  .txt { font-size: clamp(15px, 1.2vw, 18px); line-height: 1.55; }
  .txt p + p { margin-top: .9em; }
  .txt h3 { font-size: clamp(20px, 1.9vw, 28px); font-weight: 400; line-height: 1.12; letter-spacing: -.02em; margin-bottom: .7em; }
  .it img { cursor: zoom-in; }

  /* ---------------- click-to-enlarge ---------------- */
  .lb { position: fixed; inset: 0; z-index: 50; background: #fff; display: none; flex-direction: column; }
  .lb.on { display: flex; }
  .lb-stage { position: relative; flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: zoom-in; touch-action: none; }
  .lb-stage.zoomed { cursor: grab; }
  .lb-stage.drag { cursor: grabbing; }
  .lb-stage img { max-width: calc(100% - 2 * var(--pad)); max-height: 100%; user-select: none; -webkit-user-drag: none; transform-origin: 0 0; }
  .lb-bar { display: flex; justify-content: space-between; align-items: baseline; gap: var(--gap); padding: 14px var(--pad) 18px; font-size: 13px; line-height: 1.4; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .lb-bar b { font-weight: 400; color: var(--ink); margin-right: .9em; }
  .lb button { font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
  .lb button:hover, .lb button:focus-visible { text-decoration: underline; outline: none; }
  .lb-top { position: absolute; top: 1.25rem; right: var(--pad); z-index: 2; font-size: 15px; }
  .lb-nav { display: flex; gap: 1.4em; flex: none; }

  .s-full  { grid-column: 1 / -1; margin-inline: calc(var(--pad) * -1); }
  .s-full .cap { padding-inline: var(--pad); }
  .s-wide  { grid-column: 1 / -1; }
  .s-large { grid-column: span 8; }
  .s-half  { grid-column: span 6; }
  .s-small { grid-column: span 4; }
  .a-center.s-large { grid-column: 3 / span 8; }
  .a-center.s-half  { grid-column: 4 / span 6; }
  .a-center.s-small { grid-column: 5 / span 4; }
  .a-right.s-large  { grid-column: 5 / span 8; }
  .a-right.s-half   { grid-column: 7 / span 6; }
  .a-right.s-small  { grid-column: 9 / span 4; }

  @media (max-width: 760px) {
    .facts, .desc { grid-column: 1 / -1; }
    .gal .it:not(.s-full) { grid-column: 1 / -1 !important; }
  }
</style>
</head>
<body>

<header class="id">
  <a class="back" href="/">&larr; The Table</a>
  <a href="/about">Damiano Perrella</a>
  <a href="/fate" id="clock" aria-label="Current date and time. Open the planetary chart."></a>
</header>

<main id="root"></main>

<script src="../projects.js"></script>
<script>
  const FIELDS = [["year", "Year"], ["location", "Location"], ["type", "Type"], ["studio", "Studio"],
                  ["instructor", "Instructor"], ["instructors", "Instructors"], ["team", "Team"], ["client", "Client"],
                  ["area", "Area"], ["status", "Status"], ["role", "Role"], ["credits", "Credits"], ["published", "Published"]];
  const SIZES = ["full", "wide", "large", "half", "small"];
  const ALIGNS = ["left", "center", "right"];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const url = s => /^(https?:|data:|\/)/.test(s) ? s : "/" + s;      // image paths in projects.js are from the site root
  const root = document.getElementById("root");
  const slug = new URLSearchParams(location.search).get("p");
  const index = PROJECTS.findIndex(p => p.slug === slug);

  if (index < 0) {
    document.title = "Not found — Damiano Perrella";
    root.innerHTML = `<section class="notfound"><h1>404</h1><p>Project not found.</p><p><a href="/">Back to The Table</a></p></section>`;
  } else {
    const p = PROJECTS[index];
    document.title = p.title + " — Damiano Perrella";

    const facts = FIELDS.filter(([k]) => p[k])
      .map(([k, label]) => `<div><dt>${label}</dt><dd>${[].concat(p[k]).map(esc).join('<br>')}</dd></div>`).join("");
    const paras = [].concat(p.description || []).map(t => `<p>${esc(t)}</p>`).join("");
    const content = p.content || p.images || [];                       // "images" is the old name

    root.innerHTML = `
      <section class="hero"><img id="hero" alt="${esc(p.title)}" fetchpriority="high"></section>
      <article class="proj">
        <h1>${esc(p.title)}</h1>
        ${p.subtitle ? `<p class="sub">${esc(p.subtitle)}</p>` : ""}
        ${facts || paras ? `<div class="top">
            ${facts ? `<dl class="facts">${facts}</dl>` : ""}
            ${paras ? `<div class="desc">${p.descriptionTitle ? `<h2>${esc(p.descriptionTitle)}</h2>` : ""}${paras}</div>` : ""}
          </div>` : ""}
        ${facts || paras || content.length ? "" : '<p class="top soon">Coming soon.</p>'}
        ${content.length ? '<section class="gal" id="gal"></section>' : ""}
      </article>`;

    /* the full-screen image is the same one as on the card */
    const hero = document.getElementById("hero");
    hero.addEventListener("load", () => { const c = PT.sample(hero); if (c) PT.setColor(c); });
    if (p.heroPosition) hero.style.objectPosition = p.heroPosition;
    /* a dark full-screen image: the header turns white while it is on screen */
    if (p.heroInk === "light") {
      const heroEl = document.querySelector(".hero");
      const upd = () => document.body.classList.toggle("ink-light", heroEl.getBoundingClientRect().bottom > 60);
      addEventListener("scroll", upd, { passive: true }); addEventListener("resize", upd); upd();
    }
    hero.src = p.cover ? url(p.cover) : placeholderCover(index);

    /* the gallery */
    const gal = document.getElementById("gal");
    const shots = [];
    if (gal) {
      let n = 0;
      const total = content.filter(x => x.src !== undefined).length;
      const pad = String(total).length;
      content.forEach((item, i) => {
        const size = SIZES.includes(item.size) ? item.size : "wide";
        const align = ALIGNS.includes(item.align) ? item.align : "left";
        const el = document.createElement(item.text !== undefined ? "div" : "figure");
        el.className = `it s-${size} a-${align}`;
        if (item.text !== undefined) {
          el.classList.add("txt");
          if (item.heading) { const h = document.createElement("h3"); h.textContent = item.heading; el.appendChild(h); }
          [].concat(item.text).forEach(t => { const tp = document.createElement("p"); tp.textContent = t; el.appendChild(tp); });
        } else {
          n++;
          const img = document.createElement("img");
          img.loading = i < 2 ? "eager" : "lazy";
          img.decoding = "async";
          img.alt = item.caption || (p.title + ", image " + n);
          if (item.w && item.h) { img.width = item.w; img.height = item.h; }
          img.src = item.src ? url(item.src) : placeholderPlate(n - 1, item.w || 1500, item.h || 1000);
          el.appendChild(img);
          shots.push({ img, src: img.src, caption: item.caption || "", n });
          img.tabIndex = 0; img.setAttribute("role", "button");
          const idx = shots.length - 1;
          img.addEventListener("click", () => openLB(idx));
          img.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLB(idx); } });
          if (item.caption) {
            const cap = document.createElement("figcaption");
            cap.className = "cap";
            cap.innerHTML = `<b>${String(n).padStart(pad, "0")}</b>${esc(item.caption)}`;
            el.appendChild(cap);
          }
        }
        gal.appendChild(el);
      });
    }

    /* click-to-enlarge: click toggles fit / full size, drag pans, arrows and Esc work */
    const lb = document.createElement("div");
    lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true"); lb.setAttribute("aria-label", "Enlarged image");
    lb.innerHTML = `<button class="lb-top" type="button" data-a="close">Close ✕</button>
      <div class="lb-stage"><img alt=""></div>
      <div class="lb-bar"><span class="lb-cap"></span><span class="lb-nav"><button type="button" data-a="prev">&larr; Prev</button><span class="lb-count"></span><button type="button" data-a="next">Next &rarr;</button></span></div>`;
    document.body.appendChild(lb);
    const stage = lb.querySelector(".lb-stage"), big = stage.querySelector("img");
    let cur = 0, zoom = false, tx = 0, ty = 0, drag = null, moved = false;
    const place = () => { big.style.transform = zoom ? `translate(${tx}px, ${ty}px)` : ""; };
    function fit() {
      zoom = false; tx = ty = 0; stage.classList.remove("zoomed");
      big.style.maxWidth = ""; big.style.maxHeight = ""; big.style.width = ""; big.style.position = ""; big.style.left = big.style.top = "";
      place();
    }
    function show(i) {
      cur = (i + shots.length) % shots.length; fit();
      const s = shots[cur];
      big.src = s.src; big.alt = s.caption;
      const pad = String(shots.length).length;
      lb.querySelector(".lb-cap").innerHTML = `<b>${String(s.n).padStart(pad, "0")}</b>${esc(s.caption)}`;
      lb.querySelector(".lb-count").textContent = `${cur + 1} / ${shots.length}`;
    }
    function openLB(i) { show(i); lb.classList.add("on"); document.documentElement.style.overflow = "hidden"; lb.querySelector("[data-a=close]").focus(); }
    function closeLB() { lb.classList.remove("on"); document.documentElement.style.overflow = ""; fit(); const s = shots[cur]; if (s) s.img.focus({ preventScroll: true }); }
    function toggleZoom(cx, cy) {
      if (zoom) { fit(); return; }
      const r = big.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const nw = big.naturalWidth, nh = big.naturalHeight;
      if (!nw || nw <= r.width * 1.05) return;                 // already at full size
      zoom = true; stage.classList.add("zoomed");
      big.style.maxWidth = "none"; big.style.maxHeight = "none"; big.style.width = nw + "px";
      big.style.position = "absolute"; big.style.left = "0"; big.style.top = "0";
      const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;       // the point clicked, as a fraction of the image
      tx = sr.width / 2 - fx * nw; ty = sr.height / 2 - fy * nh;
      clampPan(); place();
    }
    function clampPan() {
      const sr = stage.getBoundingClientRect(), w = big.naturalWidth, h = big.naturalHeight;
      tx = w <= sr.width ? (sr.width - w) / 2 : Math.min(0, Math.max(sr.width - w, tx));
      ty = h <= sr.height ? (sr.height - h) / 2 : Math.min(0, Math.max(sr.height - h, ty));
    }
    stage.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, tx, ty }; moved = false; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener("pointermove", e => {
      if (!drag || !zoom) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; stage.classList.add("drag"); }
      tx = drag.tx + dx; ty = drag.ty + dy; clampPan(); place();
    });
    stage.addEventListener("pointerup", e => { stage.classList.remove("drag"); const was = moved; drag = null; if (!was) toggleZoom(e.clientX, e.clientY); });
    lb.addEventListener("click", e => {
      const a = e.target.closest("[data-a]"); if (!a) return;
      if (a.dataset.a === "close") closeLB(); else if (a.dataset.a === "next") show(cur + 1); else show(cur - 1);
    });
    document.addEventListener("keydown", e => {
      if (!lb.classList.contains("on")) return;
      if (e.key === "Escape") closeLB();
      else if (e.key === "ArrowRight") show(cur + 1);
      else if (e.key === "ArrowLeft") show(cur - 1);
    });
    window.addEventListener("resize", () => { if (lb.classList.contains("on")) fit(); });
    if (!shots.length) lb.remove();
  }
</script>
</body>
</html>
